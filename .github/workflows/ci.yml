name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-lockfile:
    name: Lint, lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi (binary only, no env install)
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.66.0
          run-install: false

      - name: Verify pixi.lock is in sync with pixi.toml
        run: pixi lock --check

      - name: Setup Python for ruff
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install 'ruff>=0.6,<1'

      - name: Run ruff check
        run: ruff check src/wuji_mjlab/

      - name: Run ruff format check
        run: ruff format --check src/wuji_mjlab/

  test:
    name: Reorient tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU dependency subset
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install \
            mjlab==1.3.0 \
            onnxruntime \
            numpy \
            scipy \
            'pytest>=9.0'
          pip install -e . --no-deps

      - name: Run reorient tests
        run: pytest src/wuji_mjlab/tasks/reorient/tests/ -m 'not slow' -v
