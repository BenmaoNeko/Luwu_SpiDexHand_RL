# Pre-commit hooks: install once with `pre-commit install`, then runs on every git commit.
# To run manually against the full tree: `pre-commit run --all-files`.
# To bump hook versions: `pre-commit autoupdate` (review changes before commit).

# Exclude vendored third-party code from all hooks.
exclude: ^(src/wuji_rl_libs/|pixi\.lock$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # deploy/reorient/config/cube_calibration.yaml uses !!python/tuple tags
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      # ruff / ruff-format scope matches pyproject [tool.ruff] src = ["src/wuji_mjlab"]
      # and CI workflow scope. deploy/ and scripts/ are intentionally out of scope.
      - id: ruff
        args: [--fix]
        files: ^src/wuji_mjlab/.*\.py$
      - id: ruff-format
        files: ^src/wuji_mjlab/.*\.py$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - '--skip=*.lock,*.svg,*.gif,docs/**/*.svg'
          # whis: matplotlib boxplot kwarg; unparseable: valid English variant
          - '--ignore-words-list=whis,unparseable'
