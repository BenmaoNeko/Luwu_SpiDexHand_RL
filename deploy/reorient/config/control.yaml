# Deploy hardware + runtime configuration.
#
# Model-intrinsic params (action_scale, ema_alpha, warmup_time_s, ctrl_dt,
# history_len, control_mode) are NOT here — they come from the ONNX sidecar
# JSON (onnx/<stem>.json) at runtime via ONNXPolicy.config and are applied
# by make_real_hand_env_cfg(policy_config=...) overrides. This file holds
# only deploy-specific hardware/runtime defaults.

hardware:
  effort_limit_nm: 0.5       # per-joint torque cap (WujiHandDriver default)
  lowpass_cutoff_hz: 3.0     # SDK LowPass filter cutoff (lower = smoother)

zmq:
  goal_port: 5556    # play_real publish/subscribe goal
  cube_port: 5555    # cube_world_observer publishes cube pose

# Joint limits: NOT stored here. RealHandEnv._clamp_to_joint_limits reads
# them from scene["robot"].data.soft_joint_pos_limits (mjcf-derived single
# source of truth).
